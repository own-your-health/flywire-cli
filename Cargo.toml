[package]
name = "flywire-cli"
description = "Unofficial read-only CLI for a patient's medical bills on Flywire patient portals (simpleepay.com): accounts, visits, payments and statements (health-records/v1)."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/own-your-health/flywire-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "flywire"
path = "src/lib.rs"

[[bin]]
name = "flywire"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
# `auth login --browser` (src/auth.rs, src/site.rs).
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4" }
pk-med-records = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.9" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The unit tests build a `Captured` by hand. A dev-dependency only, so the
# binary is built without it.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.4", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
